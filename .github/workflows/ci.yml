name: Quadillar LiveView Verification Gate

on:
  push:
    branches: [staging, finale-stable]
  pull_request:
    branches: [staging, finale-stable]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Deterministic Governor, Notification & Ontology Suites
        run: |
          npx --yes tsx scripts/verify-molecular-governor.ts
          npx --yes tsx scripts/verify-notification-dispatcher.ts
          npx --yes tsx scripts/verify-ontology-machine.ts
          npx --yes tsx scripts/verify-triangulation-ledger.ts
          npx --yes tsx scripts/verify-security-guard.ts
          npx --yes tsx scripts/verify-field-evidence-vault.ts
          npx --yes tsx scripts/verify-iot-ingress.ts
          npx --yes tsx scripts/verify-rbac-portfolio.ts
          npx --yes tsx scripts/verify-portfolio-probe.ts
          npx --yes tsx scripts/verify-vernacular-grounding.ts
          npx --yes tsx scripts/verify-auth-session.ts
          NEXT_PUBLIC_SUPABASE_URL="" SUPABASE_SERVICE_ROLE_KEY="" NEXT_PUBLIC_SUPABASE_ANON_KEY="" npx --yes tsx scripts/chaos-stress-test.ts
          npx --yes tsx scripts/verify-forensic-dossier.ts
          npx --yes tsx scripts/verify-offline-verifier.ts
          npx --yes tsx scripts/verify-cutover-readiness.ts
          npx --yes tsx scripts/verify-sprint19b-hardening.ts
      - name: Next Typegen & TypeScript Strict Check
        run: |
          npx next typegen
          npx tsc --noEmit
